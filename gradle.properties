# 容器 cgroup 内存上限 8Gi：daemon+Kotlin 守护+D8 worker 配额总和必须低于它，
# 否则 mergeExtDex 阶段被 cgroup OOM 击杀（表现为 daemon disappeared）。
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.7 官方认证最高到 API 35；compileSdk 36 由 androidx wear compose 1.6.2 要求，压制告警
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official
